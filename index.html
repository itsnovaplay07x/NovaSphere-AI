<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
 <script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3375090503812980"
  crossorigin="anonymous"></script>
<title>NovaSphere AI V7</title>
<style>
:root{--bg:#0b1020;--panel:#121a31;--card:#18213d;--text:#eef3ff;--muted:#9eaccb;--accent:#6d8cff;--danger:#ff6174}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#080d1b,#111936);color:var(--text)}
.app{max-width:1100px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid #293454;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:20px}.badge{font-size:12px;color:#b8c4ff;background:#202c55;padding:5px 9px;border-radius:20px}
main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px}
#messages{flex:1;min-height:55vh;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--accent)}.assistant{align-self:flex-start;background:var(--card)}
.meta{font-size:11px;color:var(--muted);margin-top:7px}.attachment{margin-top:8px;font-size:12px;background:#0e1530;padding:7px;border-radius:8px}
.composer{position:sticky;bottom:0;background:rgba(11,16,32,.96);padding:12px 0}
.file-row,.voice-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
textarea{width:100%;min-height:54px;max-height:150px;resize:vertical;border:1px solid #33426c;border-radius:14px;padding:13px;background:#101832;color:white;font-size:15px}
.actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
button,label.btn{border:0;border-radius:12px;padding:11px 14px;background:#26345f;color:white;cursor:pointer;font-size:14px}
button.primary{background:var(--accent)}button.recording{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}#status{font-size:12px;color:var(--muted);margin-left:auto}
#fileInput{display:none}.chip{font-size:12px;background:#202b4c;padding:7px 10px;border-radius:20px}
select{background:#101832;color:white;border:1px solid #33426c;padding:9px;border-radius:10px}
@media(max-width:600px){.msg{max-width:94%}header{padding:14px}.app{width:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">✦ NovaSphere AI <span class="badge">V7 Voice</span></div><div class="badge">Text • Files • Voice</div></header>
<main>
<div id="messages"></div>
<div class="composer">
<div class="file-row">
<label class="btn" for="fileInput">📎 Attach files</label>
<input id="fileInput" type="file" multiple accept=".pdf,.txt,.md,.html,.css,.js,.json,.py,.java,.c,.cpp,.csv,.sql,.xml,.yml,.yaml,.sh">
<div id="fileChips"></div>
</div>
<div class="voice-row">
<button id="micBtn" type="button">🎙 Voice Input</button>
<button id="stopSpeakBtn" type="button">🔇 Stop Voice</button>
<label>Voice <select id="voiceSelect"></select></label>
</div>
<textarea id="prompt" placeholder="Ask NovaSphere AI anything... or tap Voice Input"></textarea>
<div class="actions">
<button id="sendBtn" class="primary">Send ➤</button>
<button id="clearBtn">Clear chat</button>
<span id="status">Ready</span>
</div>
</div>
</main>
</div>
<script>
const API_URL="https://YOUR-WORKER.workers.dev";
const MAX_FILE_SIZE=2*1024*1024;
const MAX_FILES=10;
let files=[],recognition=null,isRecording=false,currentUtterance=null;
let conversations=JSON.parse(localStorage.getItem("novasphere_v7_conversations")||"[]");
let activeId=localStorage.getItem("novasphere_v7_active")||crypto.randomUUID();
let messages=[];

const $=id=>document.getElementById(id);
const messagesEl=$("messages"), promptEl=$("prompt"), statusEl=$("status"), micBtn=$("micBtn"), voiceSelect=$("voiceSelect");

function token(){return localStorage.getItem("novasphere_token")||localStorage.getItem("token")||""}
function headers(json=true){const h={};if(json)h["Content-Type"]="application/json";if(token())h.Authorization="Bearer "+token();return h}
function save(){localStorage.setItem("novasphere_v7_conversations",JSON.stringify(conversations));localStorage.setItem("novasphere_v7_active",activeId)}
function render(){
 messagesEl.innerHTML="";
 messages.forEach(m=>{
  const d=document.createElement("div");d.className="msg "+m.role;
  d.textContent=m.content||"";
  if(m.files?.length){const a=document.createElement("div");a.className="attachment";a.textContent="📎 "+m.files.map(f=>f.name).join(", ");d.appendChild(a)}
  if(m.role==="assistant"){const speak=document.createElement("button");speak.textContent="🔊 Listen";speak.style.marginTop="8px";speak.onclick=()=>speakText(m.content);d.appendChild(speak)}
  messagesEl.appendChild(d);
 });
 messagesEl.scrollTop=messagesEl.scrollHeight;
}
function persist(){
 const entry={id:activeId,messages,updatedAt:Date.now()};
 const i=conversations.findIndex(c=>c.id===activeId);if(i>=0)conversations[i]=entry;else conversations.unshift(entry);
 conversations=conversations.slice(0,50);save();
}
function add(role,content,attached=[]){messages.push({role,content,files:attached.map(f=>({name:f.name,type:f.type,size:f.size}))});persist();render()}
function setStatus(s){statusEl.textContent=s}
function renderFiles(){ $("fileChips").innerHTML=files.map((f,i)=>`<span class="chip">${escapeHtml(f.name)} ✕</span>`).join("")}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

$("fileInput").onchange=e=>{
 const incoming=[...e.target.files];
 for(const f of incoming){
  if(files.length>=MAX_FILES){alert("Maximum 10 files");break}
  if(f.size>MAX_FILE_SIZE){alert(f.name+" is larger than 2 MB");continue}
  files.push(f)
 }
 renderFiles();e.target.value="";
};
$("fileChips").onclick=e=>{const idx=[...$("fileChips").children].indexOf(e.target.closest(".chip"));if(idx>=0){files.splice(idx,1);renderFiles()}};

async function filePayload(){
 const out=[];
 for(const f of files){
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",").pop());r.onerror=reject;r.readAsDataURL(f)});
  out.push({name:f.name,type:f.type,size:f.size,data});
 }
 return out;
}
async function send(){
 const text=promptEl.value.trim();
 if(!text && !files.length)return;
 const attached=[...files]; add("user",text||"Please analyze the attached file(s).",attached);
 promptEl.value=""; files=[];renderFiles();setStatus("Thinking...");
 try{
  const body={messages:messages.filter(m=>m.role==="user"||m.role==="assistant").map(m=>({role:m.role,content:m.content})),message:text,conversationId:activeId,files:await Promise.all(attached.map(async f=>{const r=new FileReader();const data=await new Promise((res,rej)=>{r.onload=()=>res(String(r.result).split(",").pop());r.onerror=rej;r.readAsDataURL(f)});return {name:f.name,type:f.type,size:f.size,data}}))};
  const res=await fetch(API_URL+"/chat",{method:"POST",headers:headers(),body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||"Request failed");
  const reply=data.reply||data.response||"No response received.";
  activeId=data.conversationId||activeId;add("assistant",reply);setStatus("Ready");
 }catch(err){add("assistant","Error: "+err.message);setStatus("Error")}
}
$("sendBtn").onclick=send;
promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});

function populateVoices(){
 const vs=speechSynthesis.getVoices();voiceSelect.innerHTML="";
 vs.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name+" ("+v.lang+")";voiceSelect.appendChild(o)});
}
speechSynthesis.onvoiceschanged=populateVoices;populateVoices();
function speakText(text){
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
 const vs=speechSynthesis.getVoices(),v=vs[Number(voiceSelect.value)];if(v)u.voice=v;
 u.rate=1;u.pitch=1;currentUtterance=u;speechSynthesis.speak(u);
}
$("stopSpeakBtn").onclick=()=>speechSynthesis.cancel();

function setupRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){micBtn.disabled=true;micBtn.textContent="Voice unsupported";return}
 recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.continuous=false;
 recognition.onresult=e=>{let final="",interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript}promptEl.value=(promptEl.dataset.base||"")+final+interim};
 recognition.onend=()=>{isRecording=false;micBtn.classList.remove("recording");micBtn.textContent="🎙 Voice Input";setStatus("Ready")};
 recognition.onerror=e=>{setStatus("Voice error: "+e.error)};
}
setupRecognition();
micBtn.onclick=()=>{
 if(!recognition)return;
 if(isRecording){recognition.stop();return}
 promptEl.dataset.base=promptEl.value?promptEl.value+" ":"";recognition.start();isRecording=true;micBtn.classList.add("recording");micBtn.textContent="⏹ Stop Recording";setStatus("Listening...");
};
$("clearBtn").onclick=()=>{messages=[];activeId=crypto.randomUUID();persist();render();};
render();
if(!messages.length)add("assistant","Welcome to NovaSphere AI V7. You can type, upload files, or speak using Voice Input.");
</script>
</body>
</html>
